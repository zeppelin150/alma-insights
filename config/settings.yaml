agents:
  context_limit: 800000
  min_rate_interval: 25.0
  num_workers: 3
  pipeline_version: '5.2'
  stall_timeout: 300
ai_enhancements:
  keywords: true
  smoothing: true
app:
  name: Alma Insights
  version: 1.0.0
behavior:
  auto_analysis:
    incidents:
      control_chart: false
      enabled: false
      open_incidents: false
      theta_anomaly_scan: false
      trc_status_grid: false
    trc_analytics:
      csat_heatmap: false
      enabled: false
      metrics_by_trc: false
      volume_resolution_charts: false
    trending:
      cross_trc_correlation: false
      enabled: false
      rising_cooling_terms: false
      sentiment_trend: false
      topic_clusters: false
  calendar_sync:
    ai_reports: false
    analysis_pages: false
  section_defaults:
    custom:
      incidents:
        control_chart: true
        open_incidents: false
        theta_anomaly_scan: false
        trc_status_grid: true
      trc_analytics:
        csat_heatmap: false
        metrics_by_trc: false
        volume_resolution_charts: true
      trending:
        cross_trc_correlation: false
        current_mood: true
        rising_cooling_terms: false
        sentiment_trend: true
        sentiment_trend.legend: false
        topic_clusters: false
    preset: custom
  source_sync:
    enabled: false
display:
  conversations_per_page: 50
  default_date_range_days: 90
  layman_mode: true
  max_search_results: 200
export:
  google_drive:
    credentials_path: ''
    enabled: false
    folder_id: ''
gemini:
  cli_path: C:\Users\Chris\AppData\Roaming\npm\gemini.CMD
  max_conversations_per_report: 300
  model: gemini-2.5-flash
  pii_redaction: true
  temperature: 0.2
  voc_report:
    analysis_truncation: 1500
    max_tickets_per_batch: 150
    sample_all_threshold: 200
    sample_large_max: 300
    sample_medium_max: 200
links:
  guru_folder: https://app.getguru.com/folders/YOUR_FOLDER_ID
  typeform_feedback: https://YOUR_WORKSPACE.typeform.com/to/YOUR_FORM_ID
nlp_scan:
  batch_size: 25
  budget_cap: 50.0
  max_tickets_cli: 5000
  mode: agentic
  parallel_workers: 3
scanning_costs:
  gemini_plan: flash_2.5
  monthly_limit: 500.0
  per_scan_limit: 50.0
  period_limit: 2000.0
  period_type: quarterly
zendesk:
  api_token: ''
  email: ''
  lightdash:
    api_key: ''
    base_url: ''
    enabled: true
    project_id: ''
  subdomain: alma
