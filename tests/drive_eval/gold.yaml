# Gold set for the almainsightstest RCM/EHR corpus (196 synthetic docs).
#
# Each query maps to the document(s) that SHOULD rank for it. Keys are the
# document filename (without .md) as it appears in Drive — the scorer casefolds
# and collapses whitespace but preserves punctuation, so near-duplicate titles
# that differ only by year stay distinct on purpose.
#
# Categories exercise specific retrieval behaviors: natural-language recall,
# near-duplicate disambiguation, a buried needle (a code deep in a body, not a
# title), acronym/alias, deep folder nesting, and empty-result precision.
#
# The two empty-result queries have `relevant: []` — any document returned for
# them is a false positive.

queries:
  - id: q01
    query: "how do I verify a patient's insurance eligibility"
    category: natural-language
    relevant: "Insurance Eligibility Verification Workflow"
    notes: "Canonical answer. 'Front Desk Daily Checklist' is a title-vs-body distractor whose body also covers eligibility."

  - id: q02
    query: "aetna prior authorization requirements for 2026"
    category: near-duplicate-disambiguation
    relevant: "Aetna Prior Authorization Requirements 2026"
    notes: "Must pick the 2026 doc over the near-identical 2025 one."

