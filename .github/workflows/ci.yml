name: CI

# Runs the unit + integration test suite on every push and PR.
# Bundle builds live in build.yml (expensive), this job is the fast gate.

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_VERSION: '3.12'
  # Qt tests need an offscreen platform on headless runners. Safe on all 3 OSes.
  QT_QPA_PLATFORM: offscreen
  # Silence pip's outdated-version chatter in CI logs.
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.lock

      # Linux-only: Qt's offscreen platform still needs a handful of
      # system libs. Headless ubuntu-latest is 24.04 — these are usually
      # preinstalled but we pin them explicitly to avoid surprises.
      - name: Install Qt system libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libopengl0 libxcb-cursor0 libdbus-1-3

      # Install CPU-only torch FIRST on every platform so pip's transitive
      # resolution for sentence-transformers reuses it and doesn't pull
      # the multi-GB CUDA wheel on Linux/Windows.
      - name: Install CPU-only PyTorch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-qt

      - name: Phase 1 tests (foundation)
        run: |
          pytest -x -q \
            tests/test_pat_store_keyring.py \
            tests/test_hardware_profile.py \
            tests/test_crash_handler.py \
            tests/test_env_guard.py \
            tests/test_phase1_e2e.py

      - name: Phase 2 tests (splash)
        run: |
          pytest -x -q \
            tests/test_checker.py \
            tests/test_startup_checks.py \
            tests/test_splash.py \
            tests/test_phase2_e2e.py

      - name: Phase 3 tests (updater)
        run: |
          pytest -x -q \
            tests/test_update_checker_phase3.py \
            tests/test_updater_integrity.py \
            tests/test_github_app_auth.py \
            tests/test_release_manifest.py \
            tests/test_updates_check_phase3.py \
            tests/test_provision_update_token.py \
            tests/test_phase3_e2e.py

      - name: Phase 4 tests (build + integrity)
        run: |
          pytest -x -q \
            tests/test_phase4_build.py \
            tests/test_phase4_integrity.py \
            tests/test_uninstaller.py

      - name: Phase 5 tests (hardening)
        run: |
          pytest -x -q \
            tests/test_rollback.py \
            tests/test_eula_dialog.py \
            tests/test_audit_secrets.py \
            tests/test_offline_mode.py \
            tests/test_phase5_e2e.py

      - name: Regression gate (existing suites)
        run: |
          pytest -x -q \
            tests/test_updater.py \
            tests/test_source_monitor.py \
            tests/test_guru_client.py \
            tests/test_settings_manager.py

  # Fast secret-leak scan — blocks PRs that accidentally commit a PAT.
  #
  # CI runs with --no-history because git history from before Phase-5 scrub
  # may contain test-fixture strings that match credential patterns. The
  # working-tree scan is what actually protects new commits. A separate
  # deep-history audit can be run manually with:
  #
  #     python scripts/audit_secrets.py   (no flag = history included)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit secrets (working tree)
        run: python scripts/audit_secrets.py --no-history
