name: Release

# Fires on any tag that looks like a version (v9.3.0, v9.3.0-rc1, etc.)
# Also runnable manually from the Actions tab for dry runs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v9.3.0)'
        required: true
        default: 'v0.0.0-test'

permissions:
  contents: write  # needed by softprops/action-gh-release

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Build bundles in parallel for the three supported platforms
  # ─────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: AlmaInsights-win64.zip
          - os: macos-15          # Apple Silicon
            platform: macos
            artifact: AlmaInsights-macOS-arm64.zip
          - os: macos-15-intel    # Intel (macos-13 retired Dec 2025; Intel images end Fall 2027)
            platform: macos
            artifact: AlmaInsights-macOS-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Build the React Agent-chat UI into src/ui/web/dist/ so build_release.py
      # bundles it (else the shipped app falls back to the spike UI).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
      - name: Build Agent web UI
        run: npm --prefix web ci && npm --prefix web run build
      - name: Test web UI (vitest)
        run: npm --prefix web run test

      # Cache the downloads that build_release.py pulls every run —
      # Python embeddable, Node.js tarball, the HuggingFace model snapshot.
      - name: Cache build downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            installer/cache
            ~/.cache/huggingface
            models
          key: bundle-${{ matrix.platform }}-${{ hashFiles('installer/build_release.py', 'requirements.txt', 'requirements.lock') }}
          restore-keys: |
            bundle-${{ matrix.platform }}-

      # Fetch the gitignored, SHA-pinned on-device voice model so build_release
      # bundles it (else every release ships with dictation disabled).
      - name: Fetch on-device voice model
        run: python scripts/fetch_voice_model.py

      - name: Build bundle
        run: python installer/build_release.py --platform ${{ matrix.platform }}

      # ── macOS signing + notarization (only runs when secrets are present) ──
      # sign_macos.sh exits 0 cleanly if any secret is missing, so this step
      # stays green on forks / pre-enrollment runs. When all 6 secrets are
      # configured, it produces a signed + notarized zip.
      - name: Sign + notarize (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          bash installer/ci/sign_macos.sh "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7
          # Fail loudly if build_release.py wrote a differently-named zip —
          # a green job with no artifact is worse than a red one.
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 2. Aggregate artifacts, build the manifest, publish a Release
  # ─────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release manifest
        run: |
          python scripts/make_release_manifest.py \
            --version "${{ steps.tag.outputs.tag }}" \
            --artifacts dist \
            --output dist/release_manifest.json \
            --notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/AlmaInsights-*.zip
            dist/release_manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
