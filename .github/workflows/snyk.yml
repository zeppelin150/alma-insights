name: Snyk Security Scan

# Fires on:
#   - Pushes to main that change pinned dependencies
#   - PRs that change pinned dependencies (covers Dependabot-style PRs)
#   - Weekly — catches newly-disclosed CVEs against pinned versions
#   - Manual — ad-hoc deep scans from the Actions tab
# Rationale: CVE scans don't need to re-run on every code-only push; running
# them on every commit produced noisy duplicate entries in the run list.
on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/snyk.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
  schedule:
    - cron: '0 6 * * 1'     # Monday 06:00 UTC — weekly cron
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

