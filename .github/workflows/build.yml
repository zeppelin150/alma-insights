name: Build Bundles

# Runs on PRs + manual trigger. Tag pushes are handled by release.yml
# (which reuses the same bundle build step but adds signing + publish).
on:
  pull_request:
    paths:
      - 'installer/**'
      - 'requirements*.txt'
      - 'requirements.lock'
      - 'src/**'
      - 'main.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: AlmaInsights-win64.zip
          - os: macos-15
            platform: macos
            artifact: AlmaInsights-macOS-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Cache the heavy downloads — Python embeddable / python-build-standalone,
      # the Node.js tarball, and the HuggingFace model snapshot. Keyed on the
      # build script + pinned-version files so invalidation is precise.
      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: |
            installer/cache
            ~/.cache/huggingface
          key: build-${{ matrix.platform }}-${{ hashFiles('installer/build_release.py', 'requirements.txt', 'requirements.lock') }}
          restore-keys: |
            build-${{ matrix.platform }}-

      - name: Build bundle
        run: python installer/build_release.py --platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 14
