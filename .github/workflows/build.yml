name: Build Bundles

# Runs on PRs + manual trigger. Tag pushes are handled by release.yml
# (which reuses the same bundle build step but adds signing + publish).
on:
  pull_request:
    paths:
      - 'installer/**'
      - 'requirements*.txt'
      - 'requirements.lock'
      - 'src/**'
      - 'web/**'
      - 'main.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: AlmaInsights-win64.zip
          - os: macos-15          # Apple Silicon
            platform: macos
            artifact: AlmaInsights-macOS-arm64.zip
          - os: macos-15-intel    # Intel (macos-13 retired Dec 2025; Intel images end Fall 2027)
            platform: macos
            artifact: AlmaInsights-macOS-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Build the React Agent-chat UI into src/ui/web/dist/ (gitignored) so
      # build_release.py bundles it. Without this the shipped app falls back to
      # the spike static/index.html.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
      - name: Build Agent web UI
        run: npm --prefix web ci && npm --prefix web run build
      - name: Test web UI (vitest)
        run: npm --prefix web run test

      # Cache the heavy downloads — Python embeddable / python-build-standalone,
      # the Node.js tarball, and the HuggingFace model snapshot. Keyed on the
      # build script + pinned-version files so invalidation is precise.
      - name: Cache build downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            installer/cache
            ~/.cache/huggingface
            models
          key: build-${{ matrix.platform }}-${{ hashFiles('installer/build_release.py', 'requirements.txt', 'requirements.lock') }}
          restore-keys: |
            build-${{ matrix.platform }}-

      # Fetch the gitignored, SHA-pinned on-device voice model so build_release
      # bundles models/*.bin. Without this every shipped bundle has NO model and
      # dictation is permanently disabled. Idempotent (skips if already cached).
      - name: Fetch on-device voice model
        run: python scripts/fetch_voice_model.py

      - name: Build bundle
        run: python installer/build_release.py --platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 14
          # Fail loudly if build_release.py wrote a differently-named zip —
          # a green job with no artifact is worse than a red one.
          if-no-files-found: error
