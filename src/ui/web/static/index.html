<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alma Agent</title>
<style>
  :root { --bg:#FBF8F2; --panel:#FFFFFF; --ink:#1E2A22; --mid:#5B6B61;
          --accent:#0F5132; --user:#0F5132; --line:#E7E1D6; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
               font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100vh; }
  #messages { flex:1; overflow-y:auto; padding:18px 16px; }
  .msg { max-width:78%; margin:8px 0; padding:9px 13px; border-radius:12px;
         line-height:1.45; font-size:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { margin-left:auto; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .assistant { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .error { background:#F7E2E2; color:#8A1C1C; }
  .thinking { font-style:italic; color:var(--mid); }
  #status { min-height:18px; padding:0 18px; font-size:12px; color:var(--mid); }
  #composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  #input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; }
  #send { background:var(--accent); color:#fff; border:none; border-radius:9px; padding:0 18px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
  #meter { padding:4px 18px 10px; font-size:11px; color:var(--mid); }
</style>
<script src="qwebchannel.js"></script>
</head>
<body>
<div id="app">
  <div id="messages"></div>
  <div id="status"></div>
  <div id="meter"></div>
  <div id="composer">
    <input id="input" placeholder="Message the agent…" autocomplete="off">
    <button id="send" disabled>Send</button>
  </div>
</div>
<script>
  var bridge = null;
  var $ = function(id){ return document.getElementById(id); };

  function append(role, text){
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    $('messages').appendChild(d);
    $('messages').scrollTop = $('messages').scrollHeight;
  }

  function sendMsg(){
    var i = $('input');
    var text = (i.value || '').trim();
    if (!text || !bridge) return;
    append('user', text);
    i.value = '';
    bridge.send(text);
  }

  new QWebChannel(qt.webChannelTransport, function(channel){
    bridge = channel.objects.almaBridge;
    window.almaBridge = bridge;            // expose under its registered name

    function showThinking(text){
      clearThinking();
      var d = document.createElement('div');
      d.className = 'msg assistant thinking'; d.id = 'thinking';
      var s = document.createElement('div'); s.id = 'thinking-status';
      s.textContent = text || 'Renn is thinking…';
      var tl = document.createElement('div'); tl.id = 'thinking-tools';
      d.appendChild(s); d.appendChild(tl);
      $('messages').appendChild(d);
      $('messages').scrollTop = $('messages').scrollHeight;
    }
    function clearThinking(){ var t = $('thinking'); if (t) t.remove(); }

    bridge.responseReady.connect(function(t){
      clearThinking();
      append('assistant', t);
      document.title = 'RT:' + t;          // round-trip hook for headless verification
    });
    bridge.errorOccurred.connect(function(e){ clearThinking(); append('error', e); });
    bridge.busyChanged.connect(function(b){
      $('send').disabled = b;
      if (b) showThinking('Renn is thinking…'); else clearThinking();
    });
    bridge.statusUpdate.connect(function(s){
      if (!s) return;
      if ($('thinking-status')) $('thinking-status').textContent = s;   // live status in the bubble
      else $('status').textContent = s;
    });
    bridge.toolCall.connect(function(j){
      try {
        var t = JSON.parse(j);
        if (!$('thinking-tools')) showThinking('Working…');
        var row = document.createElement('div');
        row.style.cssText = 'font-size:11.5px; margin-top:3px; color:' + (t.ok ? '#0F6E56' : '#8A1C1C') + ';';
        row.textContent = (t.ok ? '✓ ' : '✗ ') + t.name
          + (t.ms ? ' · ' + t.ms + 'ms' : '')
          + (t.rows !== null && t.rows !== undefined ? ' · ' + t.rows + ' rows' : '');
        $('thinking-tools').appendChild(row);
        $('messages').scrollTop = $('messages').scrollHeight;
      } catch(e){}
    });
    bridge.telemetry.connect(function(j){
      try {
        var m = JSON.parse(j);
        if (m.tokens_in === undefined) return;
        var tools = (m.tool_names && m.tool_names.length)
          ? ' · used ' + (Array.isArray(m.tool_names) ? m.tool_names.join(', ') : m.tool_names) : '';
        $('meter').textContent = (m.model_used || 'model') + ' · ' +
          (m.tokens_in||0) + ' in / ' + (m.tokens_out||0) + ' out tokens' +
          (m.latency_ms ? ' · ' + m.latency_ms + 'ms' : '') + tools;
      } catch(e){}
    });

    $('send').disabled = false;
    $('send').onclick = sendMsg;
    $('input').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendMsg(); });
    window.__almaReady = true;             // readiness hook for headless verification
  });
</script>
</body>
</html>
