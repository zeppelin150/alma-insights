[pytest]
# Restrict test discovery to tests/ — on Windows CI runners, pytest's default
# walk was descending into D:\System Volume Information and failing with
# PermissionError before any test could run.
testpaths = tests

# Add the repo root to sys.path so `from src...` imports work regardless of
# the cwd pytest is launched from. This is the equivalent of the
# `sys.path.insert(0, ...)` preamble some of the older tests did by hand.
pythonpath = .

# 2026-05-07: Per-test 120s hard timeout via pytest-timeout. Prevents the
# "full pytest tests/ hangs on Windows" failure mode (memory:
# CLAUDE.md "Testing notes" — `test_voc_pipeline_live` and
# `test_report_orchestrator` historically hung the suite). Use
# `@pytest.mark.timeout(N)` to override per-test for legitimately long
# integration runs.
#
# Live tests opt-in via marker — `pytest -m live` runs them; default
# `pytest tests/` excludes them so a full sweep doesn't try to spin up
# a real bridge.
addopts = --tb=short --timeout=120 --timeout-method=thread -m "not live"
markers =
    live: requires a real Gemini CLI / bridge / network (skipped by default)
    slow: takes > 30s; opt-in via `pytest -m slow`
    e2e: end-to-end multi-component test
    ui: requires Qt offscreen platform
