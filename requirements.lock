# Alma Insights — Lockfile
#
# This file pins the *transitive* closure of requirements.txt with
# hashes, so a bundle built from this lockfile is byte-identical across
# machines (modulo the embeddable Python + Node archives, which have
# their own pins in installer/build_release.py).
#
# Regeneration procedure (run on the macOS M1 production machine):
#
#   python -m venv .lockenv
#   source .lockenv/bin/activate
#   pip install --upgrade pip pip-tools
#   pip-compile --generate-hashes \
#               --output-file=requirements.lock \
#               requirements.txt
#   deactivate && rm -rf .lockenv
#
# CI verifies this file via `pip install --require-hashes -r requirements.lock`.
#
# ── Direct dependencies (mirror requirements.txt) ───────────────
